<!doctype html>
<html lang="fr">

<title>Notre petit monde ♡</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#151a48;color:#fff6e6;font-family:'DotGothic16','Courier New',monospace}
#app{min-height:100vh;padding:20px 16px 56px;transition:background .6s}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.px{font-family:'Press Start 2P',monospace;font-weight:normal}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:14px}
.tight{gap:4px}
.title{font-size:18px;line-height:1.4;color:#ff8fab}
.soft{color:#d9cff5}.muted{color:#5a4a78}.small{font-size:13px}
.h2{font-size:18px}.h3{font-size:20px}
.btn{font-family:inherit;font-size:15px;min-height:44px;padding:6px 14px;border:3px solid #0f0c22;box-shadow:4px 4px 0 #0f0c22;background:#fff6e6;color:#2b2140;cursor:pointer;line-height:1.2}
.btn:active{transform:translate(2px,2px)}
.btn.sm{font-size:14px;box-shadow:3px 3px 0 #0f0c22;padding:6px 12px}
.btn.flat{box-shadow:none}
.btn.stack{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.btn.stack small{font-size:12px}
.pink{background:#ff6f91}.rose{background:#ff8fab}.yellow{background:#ffd84a}.white{background:#fff}.green{background:#8fd694}
.line{background:#06c755;color:#0f0c22;text-decoration:none;display:inline-flex;align-items:center;align-self:flex-start}
.panel{background:#fff6e6;color:#2b2140;border:4px solid #0f0c22;box-shadow:6px 6px 0 #0f0c22;padding:18px}
.panel.dark{background:#2a2450;color:#fff6e6}
.frame{position:relative;border:4px solid #0f0c22;box-shadow:6px 6px 0 #0f0c22;background:#000;line-height:0}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.input{flex:1 1 260px;min-width:0;font-family:inherit;font-size:16px;min-height:44px;padding:8px 12px;border:3px solid #0f0c22;background:#fff;color:#2b2140}
.flex1{flex:1 1 380px;min-width:0}
.x{font-family:inherit;font-size:15px;min-width:32px;min-height:32px;border:2px solid #0f0c22;background:#fff;color:#2b2140;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ffd84a;outline-offset:2px}
.ask{position:relative;min-height:calc(100vh - 76px);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-bottom:140px}
.ask-word{position:absolute;color:rgba(255,255,255,.45);white-space:nowrap;pointer-events:none}
.ask-q{font-size:26px;line-height:1.6;color:#fff;text-shadow:3px 3px 0 #1d2d7a;margin:0}
.ask-jp{font-size:24px;color:#fff}
.ask-yes,.ask-no{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;min-height:48px;border-width:4px;box-shadow:5px 5px 0 #0f0c22}
.ask-yes{top:66%;transition:all .35s}
.ask-no{font-size:14px;padding:12px 16px}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.hint{position:absolute;left:50%;top:26%;background:#fff6e6;color:#2b2140;border:3px solid #0f0c22;padding:6px 10px;font-size:14px;line-height:1.3;white-space:nowrap;pointer-events:none;animation:bob 1.2s ease-in-out infinite}
.dress-hit{position:absolute;left:42%;top:52%;width:15%;height:36%;background:transparent;border:3px dashed transparent;cursor:pointer;padding:0}
.dress-hit:hover{border-color:#ffd84a}
.label{position:absolute;left:12px;top:12px;background:#fff6e6;color:#2b2140;border:3px solid #0f0c22;padding:6px 10px;line-height:1.25;display:flex;flex-direction:column}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cd>div{background:#2a2450;color:#fff6e6;border:3px solid #0f0c22;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cd b{font-family:'Press Start 2P',monospace;font-size:22px;color:#ffd84a;font-weight:normal}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.bar{height:22px;border:3px solid #0f0c22;background:#e6dcf5}.bar>div{height:100%;background:#ff6f91}
.cbar{height:12px;border:2px solid #0f0c22;background:#e6dcf5}.cbar>div{height:100%;background:#ff6f91}
.ct{display:grid;grid-template-columns:110px minmax(0,1fr) 56px;align-items:center;gap:10px;font-size:14px}
.stamp{display:flex;align-items:center;gap:10px;background:#fff6e6;color:#2b2140;border:3px solid #0f0c22;padding:8px}
.flag{position:relative;display:flex;width:36px;height:24px;border:2px solid #0f0c22;flex-shrink:0;overflow:hidden}
.chip{font-size:14px;background:#ff8fab;color:#2b2140;border:2px solid #0f0c22;padding:4px 8px}
.legend{width:14px;height:14px;border:2px solid #0f0c22;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{color:#2b2140;border:4px solid #0f0c22;box-shadow:5px 5px 0 #0f0c22;padding:12px;display:flex;flex-direction:column;gap:8px}
.tag{font-size:12px;background:#2a2450;color:#fff6e6;padding:3px 8px;align-self:flex-start}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px}
.overlay .panel{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;line-height:1.4;max-width:420px;box-shadow:5px 5px 0 #0f0c22}
.timeline{position:relative;display:flex;flex-direction:column;gap:16px;padding-left:36px}
.timeline:before{content:'';position:absolute;left:12px;top:0;bottom:0;width:4px;background:#ff8fab}
.ev{position:relative;color:#2b2140;border:4px solid #0f0c22;box-shadow:5px 5px 0 #0f0c22;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ev i{position:absolute;left:-34px;top:14px;width:14px;height:14px;border:3px solid #0f0c22}
.hud{font-family:'Press Start 2P',monospace;font-size:12px;background:#fff6e6;color:#2b2140;border:3px solid #0f0c22;padding:8px 10px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(100%,520px)}
.mcard{aspect-ratio:1/1;perspective:700px;border:none;padding:0;background:none;cursor:pointer}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.flipped .in{transform:rotateY(180deg)}
.mcard .b,.mcard .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #0f0c22;box-shadow:3px 3px 0 #0f0c22;display:flex;align-items:center;justify-content:center}
.mcard .b{background:#ff8fab;color:#fff6e6;font-size:28px;background-image:radial-gradient(#ffb3c7 18%,transparent 20%);background-size:12px 12px}
.mcard .f{transform:rotateY(180deg);background:#fff6e6}
.mcard .f img{width:84%;height:84%;image-rendering:pixelated}
.mcard.matched .f{background:#d8f0d9;border-color:#2e8b4a}
.drum{width:104px;height:104px;border-radius:50%;border:4px solid #0f0c22;box-shadow:4px 4px 0 #0f0c22;font-family:'DotGothic16',monospace;font-size:24px;color:#fff;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.drum:active{transform:translate(2px,2px) scale(.96)}
.don{background:#e84a4a}.ka{background:#3d8ee8}
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;image-rendering:pixelated;pointer-events:none}
#app{position:relative;z-index:1}

const mk = (key, bg, fn) => { const c = document.createElement('canvas'); c.width = 32; c.height = 32; const x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, 32, 32); fn(x); F[key] = c.toDataURL(); };
const spr = (x, rows, ox, oy, pal) => rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const ch = row[i]; if (ch === '.') continue; x.fillStyle = pal[ch] || this.PAL[ch]; x.fillRect(ox + i * 2, oy + j * 2, 2, 2); } });
const edit = (rows, j, i, ch) => rows.map((r, k) => (k === j ? r.slice(0, i) + ch + r.slice(i + 1) : r));
const him = this.HIM.slice(0, 11), her = this.HER.slice(0, 11);
mk('himSmile', '#ffd84a', (x) => spr(x, him, 5, 5, {}));
mk('himBlush', '#ff8fab', (x) => spr(x, edit(edit(him, 8, 2, 'r'), 8, 8, 'r'), 5, 5, {}));
mk('himLove', '#8fd694', (x) => spr(x, him, 5, 5, { e: '#ff3d6e', l: '#ffc2d1' }));
mk('herSmile', '#9ad0ff', (x) => spr(x, her, 7, 5, {}));
mk('herWink', '#ffd84a', (x) => spr(x, edit(her, 5, 6, 'k'), 7, 5, {}));
mk('herLove', '#ff8fab', (x) => spr(x, her, 7, 5, { e: '#ff3d6e' }));
const kanji = (ch, col) => mk('k' + ch, '#fff6e6', (x) => { x.fillStyle = col; x.font = "26px 'DotGothic16', monospace"; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, 16, 17); });
kanji('愛', '#d43d6b');
kanji('好', '#3d5a98');
mk('flagJP', '#ffffff', (x) => { x.fillStyle = '#d9393e'; for (let dy = -7; dy <= 7; dy++) for (let dx = -7; dx <= 7; dx++) if (dx * dx + dy * dy <= 50) x.fillRect(16 + dx, 16 + dy, 1, 1); });
mk('flagFR', '#ffffff', (x) => { x.fillStyle = '#2f4ea0'; x.fillRect(0, 0, 11, 32); x.fillStyle = '#e0393e'; x.fillRect(21, 0, 11, 32); });
mk('oni', '#9ad0ff', (x) => spr(x, ['....WW....', '...WWWW...', '..WWWWWW..', '.WWWWWWWW.', 'WWWWWWWWWW', 'WWKKKKKKWW', 'WWKKKKKKWW'], 6, 9, { W: '#ffffff', K: '#1f3a2a' }));
mk('heart', '#fff6e6', (x) => spr(x, this.HEART, 9, 10, { X: '#ff6f91' }));
this._faces = F;
return F;
}

mNew() {
const keys = this.shuffle(Object.keys(this.makeFaces())).slice(0, 8);
const deck = this.shuffle(keys.concat(keys).map((k) => ({ k, f: false, m: false })));
this._m = { deck, open: [], lock: false, moves: 0, pairs: 0 };
}

mFlip(el) {
const m = this._m;
if (!m) return;
const i = +el.dataset.i, c = m.deck[i];
if (m.lock || c.f || c.m) return;
c.f = true;
el.classList.add('flipped');
this.blip();
m.open.push(i);
if (m.open.length < 2) return;
const a = m.open[0], b = m.open[1];
m.open = [];
m.moves++;
this.setState({ mMoves: m.moves });
const both = (cls, on) => document.querySelectorAll('.mcard[data-i="' + a + '"],.mcard[data-i="' + b + '"]').forEach((x) => x.classList.toggle(cls, on));
if (m.deck[a].k === m.deck[b].k) {
m.deck[a].m = m.deck[b].m = true;
m.pairs++;
setTimeout(() => { both('matched', true); this.chime(); }, 300);
if (m.pairs === 8) {
setTimeout(() => {
const best = this.state.mBest ? Math.min(this.state.mBest, m.moves) : m.moves;
this.log('Memory gagné en ' + m.moves + ' coups');
this.setState({ mWon: true, mBest: best });
}, 800);
}
} else {
m.lock = true;
setTimeout(() => { m.deck[a].f = m.deck[b].f = false; both('flipped', false); m.lock = false; }, 850);
}
}

/* ---------- rhythm (taiko) ---------- */
rStart() {
const ac = this.audio();
if (!ac) return;
if (this.mg) this.mg.gain.setTargetAtTime(this.state.sound ? 0.6 : 0, ac.currentTime, 0.05);
if (this._r && this._r.out) { try { this._r.out.disconnect(); } catch (err) {} }
const out = ac.createGain(); out.gain.value = 1; out.connect(this.mg);
const bpm = 112, beat = 60 / bpm, e8 = beat / 2;
const t0 = ac.currentTime + beat * 4 + 0.4;
const bars = ['d...d...', 'd...d...', 'd.d.k...', 'd.d.k...', 'd.k.d.k.', 'd.d.k.k.', 'dd..k...', 'd.k.dd..',
'k.d.k.d.', 'd.d.k.dd', 'dk..dk..', 'd.d.d.k.', 'd.kkd...', 'dd.kdd.k', 'd.k.d.k.', 'd.d.d...'];
const notes = [];
bars.forEach((bar, b) => { for (let i = 0; i < 8; i++) { const ch = bar[i]; if (ch === 'd' || ch === 'k') notes.push({ time: t0 + (b * 8 + i) * e8, type: ch === 'd' ? 'don' : 'ka', judged: false }); } });
const T = (f, d, o) => this.tone(f, d, Object.assign({ dest: out }, o));
for (let i = 0; i < 4; i++) T(i === 0 ? 1320 : 990, 0.08, { when: t0 - beat * (4 - i), type: 'triangle', vol: 0.08, attack: 0.003 });
const prog = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]], pent = [72, 74, 76, 79, 81, 84];
bars.forEach((bar, b) => {
const ch = prog[b % 4], bt = t0 + b * 8 * e8;
for (let q = 0; q < 4; q++) {
T(this.mf(ch[0] - 24), beat * 0.9, { when: bt + q * beat, type: 'triangle', vol: 0.12, attack: 0.01 });
T(110, 0.16, { when: bt + q * beat, vol: 0.1, f2: 45, attack: 0.003 });
}
T(this.mf(ch[1]), beat * 4, { when: bt, vol: 0.02, attack: 0.1 });
T(this.mf(ch[2]), beat * 4, { when: bt, vol: 0.02, attack: 0.1 });
for (let i = 0; i < 8; i++) {
const c = bar[i];
if (c === '.') continue;
const n = c === 'd' ? ch[Math.floor(i / 2) % 3] + 12 : pent[(b + i) % pent.length];
T(this.mf(n), e8 * 1.6, { when: bt + i * e8, type: 'triangle', vol: 0.05, attack: 0.005 });
}
});
this._r = { notes, t0, beat, out, end: t0 + bars.length * 8 * e8 + 1.2, combo: 0, maxCombo: 0, score: 0, good: 0, ok: 0, miss: 0, pops: [], flash: null, jump: 0 };
this.setState({ rStatus: 'playing', rScore: 0, rCombo: 0, rRes: null });
}

rAbort() {
const r = this._r;
if (r && r.out) { try { r.out.gain.setValueAtTime(0, this.ac.currentTime); r.out.disconnect(); } catch (err) {} }
this._r = null;
this.setState({ rStatus: 'idle' });
}

rSound(type) {
if (!this.ac || !this.state.sound) return;
if (type === 'don') { this.tone(150, 0.18, { vol: 0.22, f2: 70, attack: 0.003 }); this.tone(300, 0.06, { type: 'triangle', vol: 0.05, attack: 0.003 }); }
else { this.tone(1250, 0.05, { type: 'triangle', vol: 0.07, attack: 0.002 }); this.tone(2500, 0.03, { vol: 0.02, attack: 0.002 }); }
}

rHit(type) {
const r = this._r;
if (!r || this.state.rStatus !== 'playing') return;
const now = this.ac.currentTime;
this.rSound(type);
r.flash = { type, t: now };
let best = null, bd = 1;
for (const n of r.notes) {
if (n.judged) continue;
const d = Math.abs(n.time - now);
if (d < bd) { bd = d; best = n; }
if (n.time - now > 0.3) break;
}
if (!best || bd > 0.15) return;
best.judged = true;
if (best.type !== type) { this.rJudge(best, 'miss', now); return; }
this.rJudge(best, bd <= 0.06 ? 'good' : bd <= 0.12 ? 'ok' : 'miss', now);
}

rJudge(n, res, now) {
const r = this._r;
n.result = res;
if (res === 'miss') { r.miss++; r.combo = 0; }
else {
r[res]++; r.combo++; r.maxCombo = Math.max(r.maxCombo, r.combo);
r.score += (res === 'good' ? 300 : 100) + Math.min(r.combo, 50) * 2;
if (res === 'good') r.jump = now;
}
r.pops.push({ txt: res === 'good' ? '良' : res === 'ok' ? '可' : '不可', col: res === 'good' ? '#ffd84a' : res === 'ok' ? '#ffffff' : '#9aa3b5', t: now });
if (r.pops.length > 6) r.pops.shift();
this.setState({ rScore: r.score, rCombo: r.combo });
}

rUpdate() {
const r = this._r;
if (!r || this.state.rStatus !== 'playing' || !this.ac) return;
const now = this.ac.currentTime;
for (const n of r.notes) { if (!n.judged && now - n.time > 0.13) { n.judged = true; this.rJudge(n, 'miss', now); } }
if (now > r.end) {
const tot = r.notes.length;
const pct = Math.round(((r.good + r.ok * 0.5) / tot) * 100);
this.log('Jeu de rythme : ' + r.score + ' pts (' + pct + ' %)');
this.setState({ rStatus: 'done', rRes: { good: r.good, ok: r.ok, miss: r.miss, maxCombo: r.maxCombo, pct }, rBest: Math.max(this.state.rBest, r.score) });
}
}

drawRhythm(c, t) {
const W = 192, H = 108, hx = 28, hy = 36;
const L = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
const r = this._r, now = r && this.ac ? this.ac.currentTime : t / 1000;
this._dim = 0;
L(0, 0, W, H, '#2a1f5c');
for (let x = 0; x < W; x += 16) L(x, 0, 8, H, '#2f2366');
for (let i = 0; i < 20; i++) if (Math.sin(t * 0.003 + i) > 0.2) L((this.rnd(i + 40) * W) | 0, (this.rnd(i + 60) * 16) | 0, 1, 1, '#ffe9b0');
L(0, 20, W, 32, '#14102e'); L(0, 20, W, 2, '#ff8fab'); L(0, 50, W, 2, '#ff8fab');
const fl = r && r.flash && now - r.flash.t < 0.1;
this.disc(c, hx, hy, 12, fl ? (r.flash.type === 'don' ? '#ff8a8a' : '#8ac8ff') : '#fff6e6');
this.disc(c, hx, hy, 10, '#3a2f6e');
this.disc(c, hx, hy, 8, '#14102e');
if (r) {
for (let i = r.notes.length - 1; i >= 0; i--) {
const n = r.notes[i];
if (n.judged) continue;
const x = Math.round(hx + (n.time - now) * 95);
if (x > W + 10 || x < -10) continue;
this.disc(c, x, hy, 9, '#ffffff');
this.disc(c, x, hy, 7, n.type === 'don' ? '#ff4f4f' : '#3d9bff');
L(x - 3, hy - 2, 1, 2, '#14102e'); L(x + 2, hy - 2, 1, 2, '#14102e'); L(x - 1, hy + 2, 3, 1, '#14102e');
}
}
const bp = r ? (now - r.t0) / r.beat : t / 535;
const bounce = ((bp % 1) + 1) % 1 < 0.2 ? 1 : 0;
L(0, 88, W, 20, '#3a2f6e'); L(0, 88, W, 1, '#ff8fab');
const hitTop = fl ? (r.flash.type === 'don' ? '#ffb3b3' : '#b3dcff') : '#f2e6d0';
L(84, 72, 24, 16, '#b5553c'); L(84, 70, 24, 3, hitTop); L(84, 76, 24, 1, '#2b2140'); L(84, 84, 24, 1, '#2b2140'); L(90, 88, 2, 0, '#2b2140');
const blink = (t % 3800) < 140;
const jump = r && now - r.jump < 0.25 ? 3 : 0;
this.drawHim(c, 62, 88 - 27 - bounce - jump, blink);
this.drawHer(c, 116, 88 - 19 - (1 - bounce) - jump, blink);
c.save();
c.textAlign = 'center';
c.textBaseline = 'middle';
if (r) {
for (const p of r.pops) {
const age = now - p.t;
if (age > 0.5) continue;
c.globalAlpha = 1 - age / 0.5;
c.font = "11px 'DotGothic16', monospace";
c.fillStyle = '#14102e'; c.fillText(p.txt, hx + 1, 12 - age * 8 + 1);
c.fillStyle = p.col; c.fillText(p.txt, hx, 12 - age * 8);
}
c.globalAlpha = 1;
if (now < r.t0) {
const k = Math.ceil((r.t0 - now) / r.beat);
if (k >= 1 && k <= 4) { c.font = "18px 'DotGothic16', monospace"; c.fillStyle = '#ffd84a'; c.fillText(String(k), 110, 36); }
}
if (r.combo >= 3) { c.font = "9px 'DotGothic16', monospace"; c.fillStyle = '#ffd84a'; c.fillText(r.combo + ' combo', 160, 66); }
}
c.restore();
}

/* ---------- page background ---------- */
drawBg(t) {
const cv = document.getElementById('bg');
if (!cv || this.state.screen === 'ask') return;
if (t - (this._bgT || 0) < 60) return;
this._bgT = t;
const W = Math.max(80, Math.ceil(innerWidth / 4)), H = Math.max(60, Math.ceil(innerHeight / 4));
if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
const c = cv.getContext('2d');
const L = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
const cols = ['#0f1438', '#151a48', '#1c1f57', '#252364', '#31276c', '#402b73', '#522f78', '#68357b', '#80407f', '#9a4c84', '#b45d88'];
const n = cols.length, bh = H / n;
for (let i = 0; i < n; i++) L(0, Math.floor(i * bh), W, Math.ceil(bh) + 1, cols[i]);
for (let i = 1; i < n; i++) { const y = Math.floor(i * bh); c.fillStyle = cols[i]; for (let x = i % 2; x < W; x += 2) c.fillRect(x, y - 1, 1, 1); }
const ns = Math.floor((W * H) / 260);
for (let i = 0; i < ns; i++) {
const tw = Math.sin(t * 0.002 + i * 1.9);
if (tw > -0.2) L((this.rnd(i + 4000) * W) | 0, (this.rnd(i + 3000) * H * 0.65) | 0, 1, 1, tw > 0.75 ? '#ffffff' : '#bdb6ff');
}
const mx = Math.round(W * 0.86), my = Math.round(H * 0.12), mr = Math.max(3, Math.round(W * 0.018));
this.disc(c, mx, my, mr, '#fff1c1');
this.disc(c, mx + Math.ceil(mr * 0.5), my - Math.ceil(mr * 0.35), mr, cols[1]);
const cyc = 9000, p = (t % cyc) / cyc;
if (p < 0.08) {
const k = Math.floor(t / cyc), sx = this.rnd(k + 50) * W * 0.7, sy = this.rnd(k + 60) * H * 0.3, q = p / 0.08;
for (let j = 0; j < 10; j++) { c.globalAlpha = (1 - j / 10) * (1 - q); L(sx + q * W * 0.25 - j, sy + q * H * 0.12 - j * 0.5, 1, 1, '#ffffff'); }
c.globalAlpha = 1;
}
c.globalAlpha = 0.35;
for (let i = 0; i < 12; i++) {
const y = H - ((this.rnd(i + 710) * H + t * (0.004 + this.rnd(i + 700) * 0.004)) % (H + 10));
const x = this.rnd(i + 720) * W + Math.sin(t * 0.0008 + i) * 6;
this.shape(c, this.MINI, x, y, i % 3 ? '#ff8fab' : '#ffd84a');
}
c.globalAlpha = 1;
const sh = Math.max(10, Math.round(H * 0.11));
for (let x = 0, i = 0; x < W; i++) {
const w = 6 + ((this.rnd(i + 900) * 8) | 0), hh = Math.round(sh * (0.4 + this.rnd(i + 950) * 0.6));
L(x, H - hh, w, hh, '#1a1238');
for (let wy = H - hh + 2; wy < H - 1; wy += 3) for (let wx = x + 1; wx < x + w - 1; wx += 2) if (this.rnd(i * 31 + wy * 7 + wx) > 0.72) L(wx, wy, 1, 1, '#ffd56a');
x += w;
}
const th = sh * 1.9, t1 = Math.round(W * 0.18), t2 = Math.round(W * 0.8);
for (let y = 0; y < th; y++) { const f = y / th, hw = Math.round(f * f * 5); L(t1 - hw, H - th + y, hw * 2 + 1, 1, '#1a1238'); L(t2 - hw, H - th + y, hw * 2 + 1, 1, '#1a1238'); }
if (Math.floor(t / 700) % 2) L(t2, H - th - 3, 1, 3, '#ff6f91');
}


/* ---------- state, rendering, saving ---------- */
setState(patch) {
const keys = Object.keys(patch);
Object.assign(this.state, patch);
if (keys.every((k) => LIVE.has(k))) this.updateLive(); else this.render();
if (this._r && this.state.rStatus === 'playing' && !(this.state.screen === 'game' && this.state.gameTab === 'rhythm')) this.rAbort();
this.syncAmb();
this.syncMusic();
if (keys.some((k) => PERSIST.includes(k))) this.persist();
}

render() {
this.v = this.renderVals();
const root = document.getElementById('app');
root.style.background = this.v.rootBg;
root.innerHTML = this.view(this.v);
this.cv.intro = document.getElementById('cv-intro');
this.cv.scene = document.getElementById('cv-scene');
this.cv.map = document.getElementById('cv-map');
this.cv.game = document.getElementById('cv-game');
this.cv.rhythm = document.getElementById('cv-rhythm');
}

updateLive() {
this.v = this.renderVals();
document.querySelectorAll('[data-live]').forEach((el) => {
const val = String(get(this.v, el.dataset.live));
if (el.textContent !== val) el.textContent = val;
});
}

call(path, e, el) {
const fn = get(this.v, path);
if (typeof fn === 'function') fn(e, el);
}

start() {
const doc = document;
doc.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el) this.call(el.dataset.act, e, el); });
doc.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el) this.call(el.dataset.input, e, el); });
doc.addEventListener('keydown', (e) => { const el = e.target.closest('[data-enter]'); if (el && e.key === 'Enter') this.call(el.dataset.enter, e, el); });
doc.addEventListener('keydown', (e) => {
if (this.state.screen !== 'game' || this.state.gameTab !== 'rhythm' || this.state.rStatus !== 'playing' || e.repeat) return;
const k = e.key.toLowerCase();
if (k === 'f' || k === 'j' || k === ' ') { e.preventDefault(); this.rHit('don'); }
else if (k === 'd' || k === 'k') { e.preventDefault(); this.rHit('ka'); }
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { this._faces = null; if (this.state.gameTab === 'memory' && this.state.screen === 'game') this.render(); });
doc.addEventListener('pointerover', (e) => { const el = e.target.closest('[data-flee]'); if (el) this.call(el.dataset.flee, e, el); });
doc.addEventListener('focusin', (e) => { const el = e.target.closest('[data-flee]'); if (el) this.call(el.dataset.flee, e, el); });
const move = (e) => { const el = e.target.closest('#game-area'); if (el) this.call('gMove', e, el); };
doc.addEventListener('pointermove', move);
doc.addEventListener('pointerdown', (e) => { move(e); const el = e.target.closest('[data-down]'); if (el) this.call(el.dataset.down, e, el); });
const stop = () => { if (this._g) this._g.dir = 0; };
doc.addEventListener('pointerup', stop);
doc.addEventListener('pointercancel', stop);
doc.addEventListener('pointerout', (e) => { if (e.target.closest && e.target.closest('[data-down]')) stop(); });
this.render();
let last = 0;
const loop = (t) => {
requestAnimationFrame(loop);
if (t - last < 33) return;
last = t;
try { this.frame(t); } catch (err) {}
};
requestAnimationFrame(loop);
setInterval(() => this.setState({ now: Date.now() }), 1000);
this.load();
}

persist() {
const d = {};
PERSIST.forEach((k) => { d[k] = this.state[k]; });
try { localStorage.setItem('notre-petit-monde', JSON.stringify(d)); } catch (err) {}
clearTimeout(this._pt);
this._pt = setTimeout(() => {
fetch('/api/state', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(d) }).catch(() => {});
}, 800);
}

load() {
const apply = (d) => {
if (!d || typeof d !== 'object') return;
const patch = {};
PERSIST.forEach((k) => { if (d[k] !== undefined && d[k] !== null) patch[k] = d[k]; });
if (Object.keys(patch).length) { Object.assign(this.state, patch); this.render(); }
};
try { apply(JSON.parse(localStorage.getItem('notre-petit-monde') || 'null')); } catch (err) {}
fetch('/api/state').then((r) => (r.ok ? r.json() : null)).then((j) => { if (j && j.state) apply(j.state); }).catch(() => {});
}

log(msg) {
fetch('/api/log', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ msg: String(msg).slice(0, 300) }) }).catch(() => {});
}

/* ---------- views ---------- */
vGame(v) {
return `<div class="col" style="gap:16px">
<div class="row" style="gap:8px;justify-content:center">${v.gameTabs.map((g, i) => `<button type="button" class="btn sm stack" style="background:${g.bg}" data-act="gameTabs.${i}.pick"><span>${g.label}</span><small>${g.jp}</small></button>`).join('')}</div>
${v.isCatch ? this.vCatch(v) : ''}${v.isMemory ? this.vMemory(v) : ''}${v.isRhythm ? this.vRhythm(v) : ''}
</div>`;
}

vMemory(v) {
if (!this._m) this.mNew();
const m = this._m, F = this.makeFaces();
return `<div class="col" style="align-items:center;gap:14px">
<div class="row between" style="width:min(100%, 520px)"><span class="h3">Retrouve les paires ! · 神経衰弱</span>

vRhythm(v) {

${v.rDone ? `<div class="overlay"><div class="panel"><span class="px" style="font-size:18px;color:#d43d6b">${v.rScore} pts</span><span>良 ${rr.good} · 可 ${rr.ok} · 不可 ${rr.miss}</span><span class="muted small">Combo max ${rr.maxCombo} · précision ${rr.pct} %</span><span style="font-size:17px">${v.rVerdict}</span><button type="button" class="btn yellow" data-act="rStart">Rejouer · もう一回</button></div></div>` : ''}

view(v) {
if (v.isAsk) return '<div class="wrap">' + this.vAsk(v) + '</div>';
return '<div class="wrap">' + this.vHeader(v) + (v.showNav ? this.vNav(v) : '') +
(v.isIntro ? this.vIntro(v) : '') + (v.isHome ? this.vHome(v) : '') + (v.isMap ? this.vMap(v) : '') +
(v.isQuiz ? this.vQuiz(v) : '') + (v.isMovies ? this.vMovies(v) : '') + (v.isWishes ? this.vWishes(v) : '') +
(v.isLetters ? this.vLetters(v) : '') + (v.isStory ? this.vStory(v) : '') + (v.isGame ? this.vGame(v) : '') + '</div>';
}

rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

phase() {
const m = this.state.timeMode;
if (m !== 'auto') return m;
const d = new Date(this.state.now);
const h = d.getHours() + d.getMinutes() / 60;
if (h < 5 || h >= 19.5) return 'night';
if (h < 7) return 'dawn';
if (h < 17) return 'day';
return 'dusk';
}

sh(hex) {
const a = this._dim;
if (!a) return hex;
const key = hex + a;
let v = this._shc.get(key);
if (v) return v;
const n = parseInt(hex.slice(1), 16);
const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
const m = (x, y) => Math.round(x * (1 - a) + y * a);
v = 'rgb(' + m(r, 22) + ',' + m(g, 26) + ',' + m(b, 64) + ')';
this._shc.set(key, v);
return v;
}

ctx(el) { const c = el.getContext('2d'); c.imageSmoothingEnabled = false; return c; }

frame(t) {
const s = this.state;

if (s.screen === 'intro' && this.cv.intro) this.drawIntro(this.ctx(this.cv.intro), t);
if (s.screen === 'map' && this.cv.map) this.drawMap(this.ctx(this.cv.map), t);

if (s.screen === 'game' && this.cv.rhythm) { this.rUpdate(); this.drawRhythm(this.ctx(this.cv.rhythm), t); }

}

/* ---------- mini game ---------- */
gReset() { this._g = { x: 96, tx: 96, dir: 0, items: [], pops: [], score: 0, lives: 3, t: 0, spawn: 0.4, last: null, hurt: 0, cheer: 0 }; }

gUpdate(now) {
const g = this._g;
if (!g) return;
const dt = Math.min(0.05, (now - (g.last || now)) / 1000);
g.last = now;
if (this.state.gStatus !== 'playing') return;
g.t += dt;
if (g.dir) g.tx = Math.max(6, Math.min(186, g.tx + g.dir * 95 * dt));
g.x += (g.tx - g.x) * Math.min(1, dt * 12);
const speed = 1 + g.t / 30;
g.spawn -= dt;
if (g.spawn <= 0) {
g.spawn = Math.max(0.28, 0.7 - g.t * 0.009);
const r = Math.random();
const type = r < 0.58 ? 'heart' : r < 0.74 ? 'oni' : r < 0.8 ? 'star' : 'cloud';
g.items.push({ x: 8 + Math.random() * 176, y: -8, vy: (26 + Math.random() * 22) * speed, type, w: Math.random() * 6 });
}
for (const it of g.items) {
it.y += it.vy * dt;
if (!it.hit && it.y > 60 && it.y < 90 && Math.abs(it.x - g.x) < 9) {
it.hit = true;
if (it.type === 'cloud') {
g.lives--; g.hurt = 0.7;
g.pops.push({ x: it.x, y: it.y, txt: '-1 ♥', t: 0, col: '#c9d6e8' });
this.boop();
} else {
const pts = it.type === 'heart' ? 1 : it.type === 'oni' ? 2 : 5;
g.score += pts; g.cheer = 0.6;
g.pops.push({ x: it.x, y: it.y, txt: '+' + pts, t: 0, col: pts === 5 ? '#ffd84a' : '#ff8fab' });
if (this.state.sound && this.ac) this.tone(pts === 5 ? 1568 : pts === 2 ? 1175 : 988, 0.12, { type: 'square', vol: 0.03 });
}
}
}
g.items = g.items.filter((it) => !it.hit && it.y < 112);
g.pops.forEach((p) => { p.t += dt; });
g.pops = g.pops.filter((p) => p.t < 0.8);
g.hurt = Math.max(0, g.hurt - dt);
g.cheer = Math.max(0, g.cheer - dt);
const left = Math.max(0, 45 - Math.floor(g.t));
if (g.lives <= 0 || g.t >= 45) {
this.chime();
this.log('Mini-jeu : ' + g.score + ' pts');
this.setState({ gStatus: 'over', gScore: g.score, gLives: Math.max(0, g.lives), gTime: left, gBest: Math.max(this.state.gBest, g.score) });
} else if (g.score !== this.state.gScore || g.lives !== this.state.gLives || left !== this.state.gTime) {
this.setState({ gScore: g.score, gLives: g.lives, gTime: left });
}
}

/* ---------- pixel helpers ---------- */
sprite(c, rows, x, y, blink, pal, blinkTo) {
for (let j = 0; j < rows.length; j++) {
const row = rows[j];
for (let i = 0; i < row.length; i++) {
let ch = row[i];
if (ch === '.') continue;
if (blink && ch === 'e') ch = blinkTo;
c.fillStyle = pal[ch];
c.fillRect(Math.round(x + i), Math.round(y + j), 1, 1);

}

dots(c, x, y, list) {
for (let k = 0; k < list.length; k++) { c.fillStyle = list[k][2]; c.fillRect(Math.round(x + list[k][0]), Math.round(y + list[k][1]), 1, 1); }
}

c.fillRect(sx - pr, sy - pr, pr * 2 + 2, 1); c.fillRect(sx - pr, sy + pr + 1, pr * 2 + 2, 1);
c.fillRect(sx - pr, sy - pr, 1, pr * 2 + 2); c.fillRect(sx + pr + 1, sy - pr, 1, pr * 2 + 2);
c.fillStyle = '#ffd84a'; c.fillRect(sx - 1, sy - 1, 3, 3);
const P0 = [sx, sy], P1 = [262, 46], P2 = [320, 48];
const bz = (u, k) => (1 - u) * (1 - u) * P0[k] + 2 * (1 - u) * u * P1[k] + u * u * P2[k];
const step = Math.floor(t / 140);
for (let i = 0; i < 60; i++) {
if ((i + step) % 4 === 0) continue;
const u = i / 60;
c.fillStyle = 'rgba(255,143,171,0.85)';
c.fillRect(Math.round(bz(u, 0)), Math.round(bz(u, 1)), 1, 1);
}
const u = (t / 5000) % 1;
this.shape(c, this.MINI, Math.round(bz(u, 0)) - 2, Math.round(bz(u, 1)) - 2, '#ff6f91');
const b = Math.sin(t * 0.004) > 0 ? 1 : 0;
this.shape(c, this.MINI, 318, 38 - b, '#ffd84a');
}

/* ---------- sound ---------- */
audio() {
if (!this.ac) {
const AC = window.AudioContext || window.webkitAudioContext;
if (!AC) return null;
this.ac = new AC();
this.mg = this.ac.createGain();
this.mg.gain.value = 0.6;
this.mg.connect(this.ac.destination);
}
if (this.ac.state === 'suspended') this.ac.resume();
return this.ac;
}

nbuf(kind) {
this._nb = this._nb || {};
if (this._nb[kind]) return this._nb[kind];
const ac = this.ac, n = ac.sampleRate * 3, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
let last = 0;
for (let i = 0; i < n; i++) {
const w = Math.random() * 2 - 1;
if (kind === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
else if (kind === 'crackle') d[i] = Math.random() < 0.0006 ? w : 0;
else d[i] = w;
}
this._nb[kind] = b;
return b;
}

tone(f, dur, o) {
const ac = this.ac;
if (!ac) return;
o = o || {};
const t0 = o.when !== undefined ? o.when : ac.currentTime + (o.at || 0);
const osc = ac.createOscillator(), g = ac.createGain();
osc.type = o.type || 'sine';
osc.frequency.setValueAtTime(f, t0);
if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
g.gain.setValueAtTime(0.0001, t0);
g.gain.exponentialRampToValueAtTime(o.vol || 0.05, t0 + (o.attack || 0.01));
g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
osc.connect(g); g.connect(o.dest || this.mg);
osc.start(t0); osc.stop(t0 + dur + 0.05);
}

burst(when, ftype, freq, vol, dur, dest) {
const ac = this.ac;
const src = ac.createBufferSource(); src.buffer = this.nbuf('white');
const f = ac.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
const g = ac.createGain();
g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(vol, when + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
src.connect(f); f.connect(g); g.connect(dest);
src.start(when, Math.random() * 2); src.stop(when + dur + 0.05);
}

blip() { if (this.state.sound && this.ac) this.tone(660, 0.08, { type: 'square', vol: 0.03, f2: 990 }); }
chime() { if (this.state.sound && this.ac) [784, 988, 1319].forEach((f, i) => this.tone(f, 0.25, { type: 'square', vol: 0.035, at: i * 0.09 })); }
boop() { if (this.state.sound && this.ac) this.tone(240, 0.25, { type: 'square', vol: 0.03, f2: 150 }); }

pop(at) {
const ac = this.ac;
if (!ac) return;
const t0 = ac.currentTime + at;
this.burst(t0, 'bandpass', 900, 0.22, 0.6, this.mg);
this.tone(110, 0.35, { vol: 0.08, f2: 45, at });
for (let i = 0; i < 5; i++) this.tone(2500 + Math.random() * 2500, 0.05, { vol: 0.01, at: at + 0.25 + i * 0.07 + Math.random() * 0.05 });
}

melody() {
const N = [[523, 0], [659, 0.18], [784, 0.36], [1047, 0.54], [988, 0.9], [784, 1.08], [880, 1.26], [1047, 1.44], [1319, 1.8], [1175, 2.0], [1047, 2.2], [1319, 2.4], [1568, 2.7]];
N.forEach((n) => this.tone(n[0], 0.24, { type: 'square', vol: 0.04, at: n[1] + 0.2 }));
[[262, 0], [196, 0.72], [220, 1.44], [262, 2.16], [131, 2.7]].forEach((n) => this.tone(n[0], 0.6, { type: 'triangle', vol: 0.09, at: n[1] + 0.2 }));
}

/* ---------- lofi medley ---------- */
mf(n) { return 440 * Math.pow(2, (n - 69) / 12); }

syncMusic() {
const s = this.state;
const want = !!(s.music && s.sound && this.ac && s.screen !== 'ask' && s.rStatus !== 'playing' && !(s.screen === 'intro' && s.intro === 'playing'));
if (want && !this._mus) this.startMusic();
if (!want && this._mus) this.stopMusic();
}

startMusic() {
const ac = this.ac;
const g = ac.createGain();
g.gain.setValueAtTime(0.0001, ac.currentTime);
g.gain.exponentialRampToValueAtTime(0.5, ac.currentTime + 4);
g.connect(this.mg);
const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600; lp.Q.value = 0.3;
const dry = ac.createGain(); dry.gain.value = 0.75;
const wet = ac.createGain(); wet.gain.value = 0.45;
const rev = ac.createConvolver(); rev.buffer = this.revBuf();
lp.connect(dry); dry.connect(g); lp.connect(rev); rev.connect(wet); wet.connect(g);
const ti = this._musTi || 0;
this._mus = { g, lp, next: ac.currentTime + 0.3, step: 0, bar: 0, ti, mi: 3 };
this._musTimer = setInterval(() => this.musTick(), 80);
this.setState({ trackName: this.TRACKS[ti].name });
}

revBuf() {
if (this._rev) return this._rev;
const ac = this.ac, len = Math.floor(ac.sampleRate * 3), b = ac.createBuffer(2, len, ac.sampleRate);
for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
this._rev = b;
return b;
}

stopMusic() {
const m = this._mus;
this._mus = null;
clearInterval(this._musTimer);
if (!m) return;
try {
m.g.gain.setTargetAtTime(0.0001, this.ac.currentTime, 0.6);
setTimeout(() => { try { m.g.disconnect(); } catch (err) {} }, 3500);
} catch (err) {}
}

musTick() {
const m = this._mus, ac = this.ac;
if (!m) return;
while (m.next < ac.currentTime + 0.4) {
const tr = this.TRACKS[m.ti];
const sp = 60 / tr.bpm / 4;
this.musStep(m, tr, m.next, sp);
m.next += sp;
m.step++;
if (m.step % 16 === 0) {
m.bar++;
if (m.bar >= 8) {
m.bar = 0;
m.ti = (m.ti + 1) % this.TRACKS.length;
this._musTi = m.ti;
m.next += sp * 8;
this.setState({ trackName: this.TRACKS[m.ti].name });
}
}
}
}

musStep(m, tr, t, sp) {
const st = m.step % 16, bar = m.bar, ch = tr.chords[bar % 4], out = m.lp, seed = m.ti * 1000 + bar * 16 + st;
const P = (n, dur, vol, when, atk) => this.tone(this.mf(n), dur, { when, vol, attack: atk || 0.03, dest: out });
if (st === 0) {
P(ch[0] - 12, sp * 15, 0.05, t, 0.08);
ch.forEach((n, i) => P(n, sp * 14, 0.016, t + i * 0.11, 0.06));
ch.slice(-2).forEach((n) => this.tone(this.mf(n) * 1.003, sp * 16, { when: t, vol: 0.008, attack: 0.9, dest: out }));
}
if (st === 8) ch.slice(1).forEach((n, i) => P(n + 12, sp * 7, 0.008, t + i * 0.13, 0.05));
if (bar >= 1 && bar < 7 && st % 4 === 0 && this.rnd(seed) < 0.55) {
const step = [-2, -1, -1, 1, 1, 2][Math.floor(this.rnd(seed + 7) * 6)];
m.mi = Math.max(0, Math.min(tr.scale.length - 1, m.mi + step));
P(tr.scale[m.mi], sp * (4 + Math.floor(this.rnd(seed + 13) * 4)), 0.018, t, 0.04);
}
}

/* ---------- ambience ---------- */
stopAmb() {
const a = this._amb;
this._amb = null;
if (!a) return;
a.timers.forEach((x) => clearInterval(x));
try {
a.out.gain.setTargetAtTime(0.0001, this.ac.currentTime, 0.3);
setTimeout(() => { a.srcs.forEach((x) => { try { x.stop(); } catch (err) {} }); try { a.out.disconnect(); } catch (err) {} }, 1500);
} catch (err) {}
}

syncAmb() {
const s = this.state;
const ph = this.phase();
const n = ph === 'night' || ph === 'dusk';
const key = (s.sound && s.screen !== 'ask' && s.screen !== 'intro' && s.rStatus !== 'playing' && this.ac) ? s.scene + (n ? '-n' : '-d') + (s.music ? 'm' : '') : 'off';
if (key === this._ambKey) return;
this._ambKey = key;
this.stopAmb();
if (key !== 'off') this.startAmb(s.scene, n, s.music ? 0.6 : 1);
}

startAmb(id, n, level) {
const ac = this.ac;
const out = ac.createGain();
out.gain.setValueAtTime(0.0001, ac.currentTime);
out.gain.exponentialRampToValueAtTime(level, ac.currentTime + 2);
out.connect(this.mg);
const a = { out, srcs: [], timers: [] };
this._amb = a;
const noise = (kind, ftype, freq, q, vol, lfoRate, lfoDepth) => {
const src = ac.createBufferSource(); src.buffer = this.nbuf(kind); src.loop = true;
const f = ac.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
const g = ac.createGain(); g.gain.value = vol;
src.connect(f); f.connect(g); g.connect(out); src.start(); a.srcs.push(src);
if (lfoRate) {
const o1 = ac.createOscillator(); o1.frequency.value = lfoRate;
const g1 = ac.createGain(); g1.gain.value = lfoDepth;
o1.connect(g1); g1.connect(g.gain); o1.start(); a.srcs.push(o1);
const o2 = ac.createOscillator(); o2.frequency.value = lfoRate * 0.63;
const g2 = ac.createGain(); g2.gain.value = freq * 0.4;
o2.connect(g2); g2.connect(f.frequency); o2.start(); a.srcs.push(o2);
}
};
const every = (ms, p, fn) => a.timers.push(setInterval(() => { if (Math.random() < p) fn(); }, ms));
const T = (f, d, o) => this.tone(f, d, Object.assign({ dest: out }, o));
const wind = (v) => noise('brown', 'bandpass', 450, 0.7, v, 0.12, v * 0.8);
const rain = (v) => { noise('white', 'bandpass', 2500, 0.4, v); every(90, 0.5, () => T(1800 + Math.random() * 2500, 0.03, { vol: 0.012 })); };
const waves = (v) => noise('brown', 'lowpass', 650, 0.5, v, 0.09, v * 0.9);
const birds = (p) => every(700, p, () => { const f = 2200 + Math.random() * 1800, k = 2 + ((Math.random() * 3) | 0); for (let i = 0; i < k; i++) T(f * (1 + Math.random() * 0.15), 0.07, { at: i * 0.11, f2: f * 1.5, vol: 0.025 }); });
const crickets = () => every(1000, 0.8, () => { for (let i = 0; i < 3; i++) T(4700, 0.03, { at: i * 0.06, vol: 0.012 }); });
const bells = (p) => every(1800, p, () => { const sc = [1047, 1175, 1319, 1568, 1760, 2093]; const f = sc[(Math.random() * sc.length) | 0]; T(f, 2.2, { vol: 0.022, attack: 0.005 }); T(f * 2, 1.2, { vol: 0.006, attack: 0.005 }); });
const gulls = (p) => every(2600, p, () => { T(1500, 0.3, { type: 'triangle', f2: 950, vol: 0.02 }); T(1450, 0.28, { type: 'triangle', f2: 900, vol: 0.018, at: 0.34 }); });
const cicadas = (v) => {
const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 4300;
const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 4600; f.Q.value = 6;
const g = ac.createGain(); g.gain.value = v * 0.5;
const am = ac.createOscillator(); am.type = 'square'; am.frequency.value = 38;
const ag = ac.createGain(); ag.gain.value = v * 0.5;
am.connect(ag); ag.connect(g.gain);
o.connect(f); f.connect(g); g.connect(out);
[o, am].forEach((x) => { x.start(); a.srcs.push(x); });
};
const tram = () => every(6000, 0.45, () => { T(1650, 0.5, { vol: 0.03, attack: 0.003 }); T(1650, 0.5, { vol: 0.03, at: 0.25, attack: 0.003 }); });
if (id === 'tokyo') { wind(n ? 0.22 : 0.28); bells(n ? 0.35 : 0.25); }
else if (id === 'bxl') { wind(0.28); bells(0.5); }
else if (id === 'fuji') { wind(0.12); if (n) crickets(); else birds(0.6); }
else if (id === 'paris') { wind(0.2); if (n) crickets(); else birds(0.35); }
else if (id === 'lille') { rain(0.25); wind(0.08); }
else if (id === 'venice') { waves(0.18); if (n) crickets(); else gulls(0.35); }
else if (id === 'porto') { waves(0.28); if (n) crickets(); else { cicadas(0.02); gulls(0.3); } }
else if (id === 'lisbon') { waves(0.25); if (n) crickets(); else { gulls(0.35); tram(); } }
}

showNo: nc < 6, noX: s.noX, noY: s.noY,
yesX: nc >= 6 ? '50%' : '38%',
yesSize: (16 + nc * 4) + 'px', yesPad: (14 + nc * 4) + 'px ' + (20 + nc * 6) + 'px',
showHeader: s.screen !== 'ask',
tokyoTime: fmt('Asia/Tokyo'), sgTime: fmt('Asia/Singapore'),
soundLabel: s.sound ? 'Sons : oui' : 'Sons : non',
soundBg: s.sound ? '#ffd84a' : '#fff6e6',
toggleSound: () => {
const on = !this.state.sound;
if (on) this.audio();
if (this.mg) this.mg.gain.setTargetAtTime(on ? 0.6 : 0, this.ac.currentTime, 0.1);
this.setState({ sound: on });
},
musicOn: !!(s.music && s.sound),
musicLabel: s.music ? '♪ Musique : oui' : '♪ Musique : non',
musicBg: s.music ? '#ffd84a' : '#fff6e6',
trackName: s.trackName,
toggleMusic: () => {
const on = !this.state.music;
if (on) { this.audio(); if (this.mg) this.mg.gain.setTargetAtTime(0.6, this.ac.currentTime, 0.1); this.setState({ music: true, sound: true }); }
else this.setState({ music: false });
},
showNav: s.screen !== 'ask' && s.screen !== 'intro',
tabs,
isIntro: s.screen === 'intro', isHome: s.screen === 'home', isMap: s.screen === 'map',
isQuiz: s.screen === 'quiz', isMovies: s.screen === 'movies', isWishes: s.screen === 'wishes', isLetters: s.screen === 'letters',
introDone: s.intro === 'done',
setIntroCv: this.setIntroCv, setSceneCv: this.setSceneCv, setMapCv: this.setMapCv,
goHome: go('home'),
replay: () => { this.blip(); this.setState({ screen: 'ask', noCount: 0, noX: '62%', noY: '66%' }); },
daysTogether,
sceneName: sc.name, sceneJp: sc.jp, moodLabel: sc.label,
scenes, modes,
phaseLabel: ({ day: 'le jour', dawn: "l'aube", dusk: 'le crépuscule', night: 'la nuit' })[phase],
cd, cdRunning: d > 0, cdDone: d <= 0,
showHint: !s.dressed,
dressOpen: s.dressOpen,
openDress: () => { this.chime(); this._jumpT = performance.now(); this.setState({ dressOpen: true, dressed: true }); },
closeDress: () => { this.blip(); this.setState({ dressOpen: false }); },
surprise: () => { this.chime(); this._jumpT = performance.now(); this.setState({ himTop: pickRand(this.HIM_O), himAcc: pickRand(this.HIM_A), herTop: pickRand(this.HER_O), herAcc: pickRand(this.HER_A) }); },
himTops: mkOpts(this.HIM_O, 'himTop'), himAccs: mkOpts(this.HIM_A, 'himAcc'),
herTops: mkOpts(this.HER_O, 'herTop'), herAccs: mkOpts(this.HER_A, 'herAcc'),
visited, pct: ((visited / 195) * 100).toFixed(1).replace('.', ','), barW: Math.max(2, (visited / 195) * 100).toFixed(1) + '%', left: 195 - visited,
continents, countries: flags, cities, cityCount: cities.length,
travelDraft: s.travelDraft,
onTravel: (e) => this.setState({ travelDraft: e.target.value }),
onTravelKey: (e) => { if (e.key === 'Enter') addTravel(); },
addTravel,
travels: s.travels.map((x) => ({ text: x.text, remove: () => this.setState({ travels: this.state.travels.filter((y) => y.id !== x.id) }) })),
hasTravels: s.travels.length > 0,
travelLine: lineUrl('Là où je veux aller avec toi · 一緒に行きたい所', s.travels.map((x) => x.text)),
score: s.score, qNum: Math.min(s.qi + 1, total), qTotal: total, qText: Q.q, qJp: Q.jp, options,
hasPicked: s.picked !== null && !s.quizDone,
quizRunning: !s.quizDone, quizDone: s.quizDone, verdict,
feedback: s.picked === null ? '' : (s.picked === Q.a ? 'Oui ! ♡ せいかい！' : 'Raté… ざんねん！'),
quizNext: () => { this.blip(); if (this.state.qi + 1 >= total) { this.log('Quiz terminé : ' + this.state.score + '/' + total); this.setState({ quizDone: true }); } else this.setState({ qi: this.state.qi + 1, picked: null }); },
quizRestart: () => { this.blip(); this.setState({ qi: 0, picked: null, score: 0, quizDone: false }); },
toWatch, seen, toWatchCount: toWatch.length, seenCount: seen.length,
tonightText: tf ? 'Ce soir : ' + tf.title + (tf.jp ? ' · ' + tf.jp : '') : 'On n’arrive pas à choisir ? La petite machine décide.',
pickTonight: () => {
const pool = this.state.films.filter((f) => !f.seen && f.id !== this.state.tonight);
const list = pool.length ? pool : this.state.films.filter((f) => !f.seen);
if (!list.length) return;
this.chime();
this.setState({ tonight: list[(Math.random() * list.length) | 0].id });
},
filmDraft: s.filmDraft,
onFilm: (e) => this.setState({ filmDraft: e.target.value }),
onFilmKey: (e) => { if (e.key === 'Enter') addFilm(); },
addFilm,
filmLine: lineUrl('Nos films à voir · 見たい映画', s.films.filter((f) => !f.seen).map((f) => f.title)),
cats, wishes, noWishes: s.wishes.length === 0, hasWishes: s.wishes.length > 0,
wishDraft: s.wishDraft,
onWish: (e) => this.setState({ wishDraft: e.target.value }),
onWishKey: (e) => { if (e.key === 'Enter') addWish(); },
addWish,
wishLine: lineUrl('Mes envies pour nous · やりたいこと', s.wishes.map((w) => w.text + ' (' + w.cat + ')')),
letters,
isStory: false, isGame: s.screen === 'game',
gameTabs: [['catch', 'Attrape-cœurs', 'ハート'], ['memory', 'Memory', '神経衰弱'], ['rhythm', 'Rythme', '太鼓']].map((x) => ({ label: x[1], jp: x[2], bg: s.gameTab === x[0] ? '#ff6f91' : '#fff6e6', pick: () => { this.blip(); this.setState({ gameTab: x[0] }); } })),
isCatch: s.gameTab === 'catch', isMemory: s.gameTab === 'memory', isRhythm: s.gameTab === 'rhythm',
mMoves: s.mMoves, mWon: s.mWon, mBest: s.mBest,
mFlip: (e, el) => this.mFlip(el),
mRestart: () => { this.blip(); this.mNew(); this.setState({ mMoves: 0, mWon: false }); },
rIdle: s.rStatus === 'idle', rDone: s.rStatus === 'done', rScore: s.rScore, rCombo: s.rCombo, rBest: s.rBest, rRes: s.rRes,
rVerdict: !s.rRes ? '' : s.rRes.pct >= 95 ? 'Parfait ! Tu as le rythme dans le cœur ♡ フルコンボ級！' : s.rRes.pct >= 75 ? 'Super ! On fait un beau duo ♡ すごい！' : s.rRes.pct >= 50 ? 'Pas mal du tout ! もう少し！' : 'On s’entraînera ensemble ♡ がんばろう！',
rStart: () => this.rStart(),
rDon: () => this.rHit('don'),
rKa: () => this.rHit('ka'),
rTap: (e, el) => { if (this.state.rStatus !== 'playing') return; const b = el.getBoundingClientRect(); this.rHit(e.clientX - b.left < b.width / 2 ? 'don' : 'ka'); },

story: (() => {
const past = { bg: '#fff6e6', border: 'solid', dot: '#ff6f91' };
const big = { bg: '#ffe3ea', border: 'solid', dot: '#ffd84a' };
const future = { bg: '#e6dcf5', border: 'dashed', dot: '#fff6e6' };
const ev = (date, title, jp, text, look) => Object.assign({ date, title, jp, text }, look);
const trips = this.SC.map((x) => ev('[date à compléter]', x.name, x.jp, '[Ton souvenir préféré là-bas]', past));
const cdDays = Math.ceil(d / 864e5);
return [ev('28.05.2025', 'Le début de nous', '付き合った日', 'Le jour où tout a commencé ♡', big)]
.concat(trips, [
ev('28.11.2026', '1 an et demi', '一年半', daysTogether + ' jours ensemble, et ce n’est que le début.', big),
ev("Aujourd'hui", 'Vous êtes ici ♡', '今ここ', d > 0 ? 'Encore ' + cdDays + ' jours avant de se retrouver · あと' + cdDays + '日' : 'On est ensemble ♡', { bg: '#ffd84a', border: 'solid', dot: '#ff6f91' }),
ev('30.12.2026 · 19h', 'Nos retrouvailles au Japon', '日本で再会', 'Le moment où j’arrive enfin près de toi.', future),
ev('Bientôt', 'Singapour', 'シンガポール', 'Notre prochaine destination ensemble.', future)
]);
})(),
setGameCv: this.setGameCv,
gIdle: s.gStatus === 'idle', gOver: s.gStatus === 'over',
gScore: s.gScore, gTime: s.gTime, gBest: s.gBest,
gHearts: '♥'.repeat(Math.max(0, s.gLives)) + '♡'.repeat(Math.max(0, 3 - s.gLives)),
gVerdict: s.gScore >= 60 ? 'Incroyable ! Tu m’as attrapé tout entier ♡ すごい！' : s.gScore >= 30 ? 'Bravo, ça fait beaucoup d’amour ♡ よくできました！' : 'Encore un essai ? もう一回やってみよう！',
gStart: () => { this.gReset(); this.blip(); this.setState({ gStatus: 'playing', gScore: 0, gLives: 3, gTime: 45 }); },
gMove: (e, el) => {
if (!this._g) return;
const r = (el || e.currentTarget).getBoundingClientRect();
this._g.tx = Math.max(6, Math.min(186, ((e.clientX - r.left) / r.width) * 192));
},
gLeft: () => { if (this._g) this._g.dir = -1; },
gRight: () => { if (this._g) this._g.dir = 1; },
gStop: () => { if (this._g) this._g.dir = 0; },
gNudgeL: () => { if (this._g) this._g.tx = Math.max(6, this._g.tx - 10); },
gNudgeR: () => { if (this._g) this._g.tx = Math.min(186, this._g.tx + 10); }
};
}
}

const app = new App();
app.start();
</script>
</body>
</html>
